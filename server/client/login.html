<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - E-Shop</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body {
        background-color: #f5f0eb;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      nav {
        background-color: #6c5ce7;
        padding: 15px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        color: white;
        font-size: 22px;
        font-weight: 600;
        text-decoration: none;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex: 1;
        padding: 40px 20px;
      }
      .card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .card h2 {
        font-size: 30px;
        color: #2d3436;
        margin-bottom: 6px;
      }
      .card p.subtitle {
        color: #888;
        font-size: 17px;
        margin-bottom: 28px;
      }
      .input-group {
        margin-bottom: 18px;
      }
      .input-group label {
        display: block;
        font-size: 17px;
        color: #555;
        margin-bottom: 6px;
        font-weight: 500;
      }
      .input-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid #ddd;
        border-radius: 8px;
        font-size: 17px;
        outline: none;
        transition: border 0.2s;
      }
      .input-group input:focus {
        border-color: #6c5ce7;
      }
      .btn {
        width: 100%;
        padding: 13px;
        background-color: #6c5ce7;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.2s;
      }
      .btn:hover {
        background-color: #5a4bd1;
      }
      .error-msg {
        background: #ffe0e0;
        color: #d63031;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 17px;
        margin-bottom: 16px;
        display: none;
      }
      .bottom-text {
        text-align: center;
        margin-top: 20px;
        font-size: 17px;
        color: #888;
      }
      .bottom-text a {
        color: #6c5ce7;
        font-weight: 600;
        text-decoration: none;
      }
      .bottom-text a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html" class="logo">🛍️ E-Shop</a>
    </nav>
    <div class="container">
      <div class="card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Please Login to your account</p>

        <div class="error-msg" id="errorMsg"></div>

        <!-- Email field — YE MISSING THA -->
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="example@gmail.com" />
        </div>

        <!-- Password field with eye icon -->
        <div class="input-group">
          <label>Password</label>
          <div style="position: relative">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              style="padding-right: 45px"
            />
            <img
              id="togglePasswordIcon"
              src="./images/eye-close.png"
              onclick="togglePassword('password', 'togglePasswordIcon')"
              style="
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                cursor: pointer;
                width: 24px;
                height: 20px;
              "
            />
          </div>
        </div>

        <button class="btn" onclick="loginUser()">Login</button>

        <div class="bottom-text">
          Want to create an account?
          <a href="register.html">Please Register</a>
        </div>
      </div>
    </div>

    <script>
      async function loginUser() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (!email || !password) {
          showError("Please enter all fields!");
          return;
        }

        try {
          const res = await fetch("http://localhost:3001/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          console.log("Login response:", data);

          if (data.token) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));
            window.location.href = "index.html";
          } else {
            showError(data.error || "Login failed, Please try again!");
          }
        } catch (err) {
          console.error("LOGIN ERROR:", err);
          showError("Something went wrong, please try again!");
        }
      }

      function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === "password") {
          input.type = "text";
          icon.src = "./images/eye-open.png";
        } else {
          input.type = "password";
          icon.src = "./images/eye-close.png";
        }
      }

      function showError(msg) {
        const el = document.getElementById("errorMsg");
        el.textContent = msg;
        el.style.display = "block";
      }
    </script>
  </body>
</html>
