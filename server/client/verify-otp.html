<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Verify OTP</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: #f5f0eb;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      nav {
        background: #6c5ce7;
        padding: 15px 40px;
      }

      .logo {
        color: white;
        text-decoration: none;
        font-size: 22px;
        font-weight: 600;
      }

      .container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      h2 {
        color: #2d3436;
        margin-bottom: 8px;
      }

      .subtitle {
        color: #888;
        margin-bottom: 25px;
      }

      .input-group {
        margin-bottom: 18px;
      }

      .input-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
      }

      .input-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
        font-size: 16px;
      }

      .input-group input:focus {
        border-color: #6c5ce7;
      }

      .btn {
        width: 100%;
        border: none;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
      }

      .verify-btn {
        background: #6c5ce7;
        color: white;
        margin-top: 10px;
      }

      .verify-btn:hover {
        background: #5a4bd1;
      }

      .resend-btn {
        margin-top: 12px;
        background: #dfe6e9;
      }

      .resend-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .timer {
        text-align: center;
        margin-top: 15px;
        font-weight: 600;
        color: #d63031;
      }

      .error-msg {
        display: none;
        background: #ffe0e0;
        color: #d63031;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
      }

      .success-msg {
        display: none;
        background: #e0ffe0;
        color: #00b894;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
      }
    </style>
  </head>

  <body>
    <nav>
      <a href="index.html" class="logo">🛍️ E-Shop</a>
    </nav>

    <div class="container">
      <div class="card">
        <h2>Verify OTP</h2>

        <p class="subtitle">OTP has been sent to your email</p>

        <div id="errorMsg" class="error-msg"></div>

        <div id="successMsg" class="success-msg"></div>

        <div class="input-group">
          <label>Enter OTP</label>

          <input
            type="text"
            id="otp"
            maxlength="6"
            placeholder="Enter 6 digit OTP"
          />
        </div>

        <div id="timer" class="timer">OTP expires in 60s</div>

        <button class="btn verify-btn" onclick="verifyOtp()">Verify OTP</button>

        <button
          id="resendBtn"
          class="btn resend-btn"
          onclick="resendOtp()"
          disabled
        >
          Resend OTP
        </button>
      </div>
    </div>

    <script>
      const timerEl = document.getElementById("timer");
      const resendBtn = document.getElementById("resendBtn");
      let interval;

      function startTimer() {
        clearInterval(interval);
        let seconds = 60; // 1 minutes
        resendBtn.disabled = true;
        timerEl.textContent = `OTP expires in ${seconds}s`;
        interval = setInterval(() => {
          seconds--;
          timerEl.textContent = `OTP expires in ${seconds}s`;
          if (seconds <= 0) {
            clearInterval(interval);
            timerEl.textContent = "OTP Expired";
            resendBtn.disabled = false;
          }
        }, 1000);
      }
      startTimer();

      async function verifyOtp() {
        try {
          const email = localStorage.getItem("otpEmail");
          const otp = document.getElementById("otp").value.trim();
          console.log("Verifying OTP:", email, otp);

          const res = await fetch("http://localhost:3001/api/auth/verify-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, otp }),
          });
          const data = await res.json();
          console.log("Verify response:", data);

          if (data.success) {
            showSuccess("OTP Verified Successfully!");
            localStorage.removeItem("otpEmail");
            setTimeout(() => {
              window.location.href = "login.html";
            }, 1500);
          } else {
            showError(data.error || "Verification failed!");
          }
        } catch (err) {
          console.error("VERIFY ERROR:", err);
          showError("Something went wrong, please try again!");
        }
      }

      async function resendOtp() {
        try {
          const email = localStorage.getItem("otpEmail");
          const res = await fetch("http://localhost:3001/api/auth/resend-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          const data = await res.json();
          console.log("Resend response:", data);

          if (data.success) {
            showSuccess("New OTP Sent!");
            startTimer();
          } else {
            showError(data.error || "Resend failed!");
          }
        } catch (err) {
          console.error("RESEND ERROR:", err);
          showError("Something went wrong, please try again!");
        }
      }

      function showError(msg) {
        const el = document.getElementById("errorMsg");
        el.textContent = msg;
        el.style.display = "block";
        document.getElementById("successMsg").style.display = "none";
      }
      function showSuccess(msg) {
        const el = document.getElementById("successMsg");
        el.textContent = msg;
        el.style.display = "block";
        document.getElementById("errorMsg").style.display = "none";
      }
    </script>
  </body>
</html>
